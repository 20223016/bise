<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(title='商品管理', content=~{::div})}">
<body>
    <div class="space-y-8 pb-20">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-4xl font-black text-slate-900 tracking-tight mb-2">商品管理</h1>
                <p class="text-slate-500 font-bold">管理积分兑换中心的商品库存</p>
            </div>
            <a href="/admin/products/new" class="inline-flex items-center px-6 py-3 bg-primary-600 text-white text-sm font-black rounded-xl hover:bg-primary-700 transition-all shadow-vibrant">
                <svg class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                添加商品
            </a>
        </div>

        <div th:if="${success}" class="p-4 bg-green-50 rounded-2xl border border-green-100 flex items-center gap-3">
            <svg class="h-5 w-5 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            <p class="text-sm font-bold text-green-600" th:text="${success}">成功信息</p>
        </div>

        <div th:if="${error}" class="p-4 bg-red-50 rounded-2xl border border-red-100 flex items-center gap-3">
            <svg class="h-5 w-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            <p class="text-sm font-bold text-red-600" th:text="${error}">错误信息</p>
        </div>

        <div class="bg-white rounded-[2.5rem] shadow-soft border border-slate-100 overflow-hidden">
            <div class="p-8 border-b border-slate-100">
                <div class="flex items-center justify-between">
                    <h2 class="text-2xl font-black text-slate-900 tracking-tight">商品列表</h2>
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest" th:text="${products.size() + ' 件商品'}">0 件商品</span>
                </div>
            </div>

            <div class="divide-y divide-slate-100">
                <div th:each="product : ${products}" class="px-8 py-6 hover:bg-slate-50/50 transition-colors">
                    <div class="flex items-start justify-between gap-6">
                        <div class="flex items-start gap-6 flex-1">
                            <div class="w-24 h-24 bg-slate-100 rounded-2xl overflow-hidden flex-shrink-0 flex items-center justify-center">
                                <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}" th:alt="${product.name}" class="w-full h-full object-cover">
                                <svg th:if="${product.imageUrl == null}" class="h-12 w-12 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg>
                            </div>
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-3">
                                    <span th:class="'px-3 py-1 text-[10px] font-black uppercase tracking-widest rounded-lg ' +
                                        ${product.stock <= 0 ? 'bg-red-100 text-red-700' :
                                          product.stock <= 5 ? 'bg-amber-100 text-amber-700' :
                                          'bg-green-100 text-green-700'}">
                                        <span th:if="${product.stock <= 0}">已兑换完</span>
                                        <span th:if="${product.stock > 0 && product.stock <= 5}">库存紧张</span>
                                        <span th:if="${product.stock > 5}">库存充足</span>
                                    </span>
                                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest" th:text="${'库存: ' + product.stock}">库存: 0</span>
                                </div>
                                <h3 class="text-lg font-black text-slate-900 mb-2" th:text="${product.name}">商品名称</h3>
                                <p class="text-slate-600 font-bold text-sm mb-4 line-clamp-1" th:text="${product.description}">商品描述</p>
                                <div class="flex items-center gap-4 text-[10px] font-bold text-slate-400">
                                    <span class="text-primary-600 font-black" th:text="${product.requiredPoints + ' 积分'}">0 积分</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-col gap-2">
                            <a th:href="@{/admin/products/{id}/restock(id=${product.id})}" class="px-4 py-2 bg-blue-50 text-blue-700 text-[10px] font-black uppercase tracking-widest rounded-xl border border-blue-100 hover:bg-blue-600 hover:text-white transition-all text-center">
                                补货
                            </a>
                            <form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post">
                                <button type="submit" class="px-4 py-2 bg-red-50 text-red-700 text-[10px] font-black uppercase tracking-widest rounded-xl border border-red-100 hover:bg-red-600 hover:text-white transition-all w-full" onclick="return confirm('确定要删除这个商品吗？');">
                                    删除
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
                <div th:if="${products.empty}" class="p-20 text-center text-slate-400 font-bold text-sm">
                    暂无商品，请添加商品
                </div>
            </div>
        </div>
    </div>
</body>
</html>
