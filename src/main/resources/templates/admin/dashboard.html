<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(title='管理后台', content=~{::div})}">
<body>
    <div class="space-y-12 pb-20">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-8">
            <div>
                <h1 class="text-4xl font-black text-slate-900 tracking-tight mb-2">管理工作台</h1>
                <p class="text-slate-500 font-bold">欢迎回来，管理员。在这里掌控社区志愿服务的点点滴滴。</p>
            </div>
            
            <div class="flex flex-col sm:flex-row gap-4">
                <a href="/admin/reports" class="inline-flex items-center px-8 py-4 bg-white text-slate-900 font-black rounded-2xl hover:bg-slate-50 transition-all shadow-soft hover:scale-105 active:scale-95 border border-slate-100">
                    <svg class="h-6 w-6 mr-3 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2V7m3 10v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h8a2 2 0 012 2v14a2 2 0 01-2 2z" /></svg>
                    数据统计
                </a>
                <a href="/admin/users" class="inline-flex items-center px-8 py-4 bg-purple-600 text-white font-black rounded-2xl hover:bg-purple-700 transition-all shadow-vibrant hover:scale-105 active:scale-95 group">
                    <svg class="h-6 w-6 mr-3 group-hover:rotate-90 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" /></svg>
                    用户管理
                </a>
                <a href="/admin/activities/new" class="inline-flex items-center px-8 py-4 bg-primary-600 text-white font-black rounded-2xl hover:bg-primary-700 transition-all shadow-vibrant hover:scale-105 active:scale-95 group">
                    <svg class="h-6 w-6 mr-3 group-hover:rotate-90 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4" /></svg>
                    发布新志愿活动
                </a>
            </div>
        </div>

        <!-- Dashboard Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="bg-white p-10 rounded-[2.5rem] shadow-soft border border-slate-100 flex items-center gap-8 group hover:border-primary-200 transition-all duration-500 hover:-translate-y-1">
                <div class="h-20 w-20 bg-blue-50 text-blue-600 rounded-[2rem] flex items-center justify-center group-hover:bg-primary-600 group-hover:text-white transition-all duration-500 shadow-sm group-hover:rotate-12">
                    <svg class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 005.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                </div>
                <div>
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">待审核志愿者</p>
                    <div class="flex items-baseline gap-2">
                        <p class="text-5xl font-black text-slate-900 tracking-tighter" th:text="${pendingVolunteers.size()}">0</p>
                        <span class="text-xs font-black text-primary-600 animate-pulse">Pending</span>
                    </div>
                </div>
            </div>
            <div class="bg-white p-10 rounded-[2.5rem] shadow-soft border border-slate-100 flex items-center gap-8 group hover:border-primary-200 transition-all duration-500 hover:-translate-y-1">
                <div class="h-20 w-20 bg-green-50 text-green-600 rounded-[2rem] flex items-center justify-center group-hover:bg-primary-600 group-hover:text-white transition-all duration-500 shadow-sm group-hover:rotate-12">
                    <svg class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                </div>
                <div>
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">活跃活动总数</p>
                    <div class="flex items-baseline gap-2">
                        <p class="text-5xl font-black text-slate-900 tracking-tighter" th:text="${activities.size()}">0</p>
                        <span class="text-xs font-black text-green-600">Active</span>
                    </div>
                </div>
            </div>
            <div class="bg-white p-10 rounded-[2.5rem] shadow-soft border border-slate-100 flex items-center gap-8 group hover:border-primary-200 transition-all duration-500 hover:-translate-y-1">
                <div class="h-20 w-20 bg-purple-50 text-purple-600 rounded-[2rem] flex items-center justify-center group-hover:bg-primary-600 group-hover:text-white transition-all duration-500 shadow-sm group-hover:rotate-12">
                    <svg class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                </div>
                <div>
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">互助需求待办</p>
                    <div class="flex items-baseline gap-2">
                        <p class="text-5xl font-black text-slate-900 tracking-tighter" th:text="${demands.size()}">0</p>
                        <span class="text-xs font-black text-purple-600">Tasks</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-2 gap-12">
            <!-- Volunteer Audit -->
            <div class="space-y-8">
                <div class="flex items-center justify-between">
                    <h2 class="text-2xl font-black text-slate-900 tracking-tight">志愿者注册审核</h2>
                    <span th:if="${!pendingVolunteers.empty}" class="px-3 py-1 bg-red-50 text-red-600 text-[10px] font-black rounded-full border border-red-100 animate-pulse">待处理</span>
                </div>
                
                <div class="bg-white rounded-[2.5rem] shadow-soft border border-slate-100 overflow-hidden">
                    <div th:if="${pendingVolunteers.empty}" class="p-20 text-center text-slate-400 font-bold text-sm">
                        目前没有待审核的申请。
                    </div>
                    <table th:if="${!pendingVolunteers.empty}" class="min-w-full divide-y divide-slate-100">
                        <thead>
                            <tr class="bg-slate-50/50">
                                <th class="px-8 py-5 text-left text-[10px] font-black text-slate-400 uppercase tracking-widest">申请人</th>
                                <th class="px-8 py-5 text-left text-[10px] font-black text-slate-400 uppercase tracking-widest">技能标签</th>
                                <th class="px-8 py-5 text-right text-[10px] font-black text-slate-400 uppercase tracking-widest">操作</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-50">
                            <tr th:each="profile : ${pendingVolunteers}" class="hover:bg-slate-50/50 transition-colors group">
                                <td class="px-8 py-6">
                                    <div class="flex items-center gap-4">
                                        <div class="h-10 w-10 rounded-xl bg-primary-100 flex items-center justify-center text-primary-700 font-black text-sm">
                                            <span th:text="${profile.user.realName.substring(0,1).toUpperCase()}">A</span>
                                        </div>
                                        <div>
                                            <p class="text-sm font-black text-slate-900" th:text="${profile.user.realName}">姓名</p>
                                            <p class="text-[10px] font-bold text-slate-400" th:text="${profile.user.username}">手机号</p>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-8 py-6">
                                    <div class="flex flex-wrap gap-1">
                                        <span th:if="${profile.skills != null and !profile.skills.isEmpty()}" th:each="skill : ${profile.skills}" th:text="${skill}" class="px-2 py-0.5 bg-blue-50 text-blue-700 text-[10px] font-black rounded-lg border border-blue-100 uppercase tracking-tighter">技能</span>
                                    </div>
                                </td>
                                <td class="px-8 py-6 whitespace-nowrap text-right">
                                    <div class="flex items-center justify-end gap-3">
                                        <form th:action="@{/admin/volunteers/{id}/approve(id=${profile.user.id})}" method="post">
                                            <button type="submit" class="px-4 py-2 bg-green-50 text-green-700 text-[10px] font-black uppercase tracking-widest rounded-xl border border-green-100 hover:bg-green-600 hover:text-white transition-all">通过</button>
                                        </form>
                                        <form th:action="@{/admin/volunteers/{id}/reject(id=${profile.user.id})}" method="post">
                                            <button type="submit" class="px-4 py-2 bg-white text-red-600 text-[10px] font-black uppercase tracking-widest rounded-xl border border-slate-100 hover:bg-red-600 hover:text-white transition-all">拒绝</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Activity List -->
            <div class="space-y-8">
                <div class="flex items-center justify-between">
                    <h2 class="text-2xl font-black text-slate-900 tracking-tight">活动状态概览</h2>
                    <a href="/activities" class="text-primary-600 font-black text-[10px] uppercase tracking-widest hover:underline decoration-2 underline-offset-4">查看全表</a>
                </div>
                
                <div class="bg-white rounded-[2.5rem] shadow-soft border border-slate-100 overflow-hidden">
                    <table class="min-w-full divide-y divide-slate-100">
                        <thead>
                            <tr class="bg-slate-50/50">
                                <th class="px-8 py-5 text-left text-[10px] font-black text-slate-400 uppercase tracking-widest">活动详情</th>
                                <th class="px-8 py-5 text-left text-[10px] font-black text-slate-400 uppercase tracking-widest">招募进度</th>
                                <th class="px-8 py-5 text-right text-[10px] font-black text-slate-400 uppercase tracking-widest">状态</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-50">
                            <tr th:each="activity : ${activities}" class="hover:bg-slate-50/50 transition-colors group">
                                <td class="px-8 py-6">
                                    <p class="text-sm font-black text-slate-900 line-clamp-1" th:text="${activity.title}">活动名称</p>
                                    <p class="text-[10px] font-bold text-slate-400 mt-1" th:text="${#temporals.format(activity.startTime, 'yyyy-MM-dd')}">时间</p>
                                </td>
                                <td class="px-8 py-6">
                                    <div class="flex items-center gap-4">
                                        <span class="text-[10px] font-black text-slate-900 w-8" th:text="${activity.enrolledNumber + '/' + activity.recruitNumber}">0/0</span>
                                        <div class="flex-grow max-w-[100px] bg-slate-100 rounded-full h-1.5 overflow-hidden">
                                            <div class="bg-primary-600 h-full rounded-full transition-all duration-500 shadow-sm" th:style="|width: ${activity.progressPercentage}%|"></div>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-8 py-6 text-right whitespace-nowrap">
                                    <div class="flex items-center justify-end gap-3">
                                        <span th:text="${activity.status}" 
                                              class="px-3 py-1 bg-primary-50 text-primary-700 text-[10px] font-black uppercase tracking-widest rounded-lg border border-primary-100">状态</span>
                                        <form th:action="@{/admin/activities/{id}/delete(id=${activity.id})}" method="post">
                                            <button type="submit" class="px-4 py-2 bg-red-50 text-red-700 text-[10px] font-black uppercase tracking-widest rounded-xl border border-red-100 hover:bg-red-600 hover:text-white transition-all" onclick="return confirm('确定要删除这个活动吗？');">删除</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
