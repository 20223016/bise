<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(title='需求管理', content=~{::div})}">
<body>
    <div class="space-y-8 pb-20">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-4xl font-black text-slate-900 tracking-tight mb-2">需求管理</h1>
                <p class="text-slate-500 font-bold">管理所有互助需求，包括删除操作</p>
            </div>
        </div>

        <div class="bg-white rounded-[2.5rem] shadow-soft border border-slate-100 overflow-hidden">
            <div class="p-8 border-b border-slate-100">
                <div class="flex items-center justify-between">
                    <h2 class="text-2xl font-black text-slate-900 tracking-tight">需求列表</h2>
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest" th:text="${demands.size() + ' 个需求'}">0 个需求</span>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-100">
                    <thead>
                        <tr class="bg-slate-50/50">
                            <th class="px-8 py-5 text-left text-[10px] font-black text-slate-400 uppercase tracking-widest">需求信息</th>
                            <th class="px-8 py-5 text-left text-[10px] font-black text-slate-400 uppercase tracking-widest">发布者</th>
                            <th class="px-8 py-5 text-left text-[10px] font-black text-slate-400 uppercase tracking-widest">状态</th>
                            <th class="px-8 py-5 text-left text-[10px] font-black text-slate-400 uppercase tracking-widest">进度</th>
                            <th class="px-8 py-5 text-right text-[10px] font-black text-slate-400 uppercase tracking-widest">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        <tr th:each="demand : ${demands}" class="hover:bg-slate-50/50 transition-colors">
                            <td class="px-8 py-6">
                                <p class="text-sm font-black text-slate-900 line-clamp-2" th:text="${demand.title}">需求标题</p>
                                <p class="text-[10px] font-bold text-slate-400 mt-1" th:text="${demand.type}">类型</p>
                            </td>
                            <td class="px-8 py-6">
                                <p class="text-sm font-black text-slate-900" th:text="${demand.resident != null ? (demand.resident.realName != null ? demand.resident.realName : demand.resident.username) : '未知'}">发布者</p>
                                <p class="text-[10px] font-bold text-slate-400" th:text="${demand.resident != null ? demand.resident.username : '未知'}">手机号</p>
                            </td>
                            <td class="px-8 py-6">
                                <span th:switch="${demand.status.name()}" class="px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-widest">
                                    <span th:case="'PENDING'" class="bg-yellow-50 text-yellow-700 border border-yellow-100">待处理</span>
                                    <span th:case="'IN_PROGRESS'" class="bg-blue-50 text-blue-700 border border-blue-100">进行中</span>
                                    <span th:case="'COMPLETED'" class="bg-green-50 text-green-700 border border-green-100">已完成</span>
                                    <span th:case="*" class="bg-slate-50 text-slate-700 border border-slate-100">未知</span>
                                </span>
                            </td>
                            <td class="px-8 py-6">
                                <div class="flex items-center gap-2">
                                    <span class="text-sm font-black text-slate-900 w-16" th:text="${demand.progressPercentage != null ? demand.progressPercentage + '%' : '0%'}">0%</span>
                                    <div class="flex-grow max-w-[120px] bg-slate-100 rounded-full h-2 overflow-hidden">
                                        <div class="bg-primary-600 h-full rounded-full transition-all duration-500" th:style="'width: ' + (demand.progressPercentage != null ? demand.progressPercentage : 0) + '%'"></div>
                                    </div>
                                </div>
                            </td>
                            <td class="px-8 py-6 whitespace-nowrap text-right">
                                <a th:href="@{/demands/{id}(id=${demand.id})}" class="px-4 py-2 bg-primary-50 text-primary-700 text-[10px] font-black uppercase tracking-widest rounded-xl border border-primary-100 hover:bg-primary-600 hover:text-white transition-all inline-block mb-2">
                                    查看
                                </a>
                                <form th:action="@{/admin/demands/{id}/delete(id=${demand.id})}" method="post">
                                    <button type="submit" class="px-4 py-2 bg-red-50 text-red-700 text-[10px] font-black uppercase tracking-widest rounded-xl border border-red-100 hover:bg-red-600 hover:text-white transition-all" onclick="return confirm('确定要删除这个需求吗？');">
                                        删除
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
