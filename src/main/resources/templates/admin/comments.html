<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(title='评论管理', content=~{::div})}">
<body>
    <div class="space-y-8 pb-20">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-4xl font-black text-slate-900 tracking-tight mb-2">评论管理</h1>
                <p class="text-slate-500 font-bold">管理所有评论，包括删除操作</p>
            </div>
        </div>

        <div class="bg-white rounded-[2.5rem] shadow-soft border border-slate-100 overflow-hidden">
            <div class="p-8 border-b border-slate-100">
                <div class="flex items-center justify-between">
                    <h2 class="text-2xl font-black text-slate-900 tracking-tight">评论列表</h2>
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest" th:text="${comments.size() + ' 条评论'}">0 条评论</span>
                </div>
            </div>
            
            <div class="divide-y divide-slate-100">
                <div th:each="comment : ${comments}" class="px-8 py-6 hover:bg-slate-50/50 transition-colors">
                    <div class="flex items-start justify-between gap-6">
                        <div class="flex-1">
                            <div class="flex items-center gap-4 mb-4">
                                <div class="h-10 w-10 rounded-xl bg-primary-100 flex items-center justify-center text-primary-700 font-black text-sm">
                                    <span th:text="${comment.user != null ? (comment.user.realName != null ? comment.user.realName.substring(0,1).toUpperCase() : (comment.user.username != null ? comment.user.username.substring(0,1).toUpperCase() : 'U')) : 'U'}">U</span>
                                </div>
                                <div>
                                    <p class="text-sm font-black text-slate-900" th:text="${comment.user != null ? (comment.user.realName != null ? comment.user.realName : (comment.user.username != null ? comment.user.username : '未知用户')) : '未知用户'}">用户</p>
                                    <p class="text-[10px] font-bold text-slate-400" th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}">时间</p>
                                </div>
                            </div>
                            <p class="text-slate-700 font-bold whitespace-pre-line" th:text="${comment.content}">评论内容</p>
                            <div class="mt-4 flex items-center gap-2">
                                <span class="px-3 py-1 bg-slate-50 text-slate-700 text-[10px] font-black uppercase tracking-widest rounded-lg border border-slate-100">
                                    需求: <span th:text="${comment.demand != null ? comment.demand.title : '未知'}">需求标题</span>
                                </span>
                            </div>
                        </div>
                        <div class="whitespace-nowrap">
                            <form th:action="@{/admin/comments/{id}/delete(id=${comment.id})}" method="post">
                                <button type="submit" class="px-4 py-2 bg-red-50 text-red-700 text-[10px] font-black uppercase tracking-widest rounded-xl border border-red-100 hover:bg-red-600 hover:text-white transition-all" onclick="return confirm('确定要删除这个评论吗？');">
                                    删除
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
                <div th:if="${comments.empty}" class="p-20 text-center text-slate-400 font-bold text-sm">
                    暂无评论
                </div>
            </div>
        </div>
    </div>
</body>
</html>
