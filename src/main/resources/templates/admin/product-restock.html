<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(title='商品补货', content=~{::section})}">
<body>
    <section class="max-w-2xl mx-auto py-12 px-4">
        <div class="bg-white p-10 md:p-16 rounded-[3rem] shadow-soft border border-slate-100 relative overflow-hidden">
            <div class="absolute top-0 left-0 -mt-12 -ml-12 h-40 w-40 bg-blue-50 rounded-full blur-3xl opacity-50"></div>

            <div class="relative">
                <div class="text-center mb-12">
                    <div class="mx-auto h-16 w-16 bg-blue-600 rounded-2xl flex items-center justify-center mb-6 shadow-vibrant">
                        <svg class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                    </div>
                    <h2 class="text-4xl font-black text-slate-900 tracking-tight">商品补货</h2>
                    <p class="mt-4 text-slate-500 font-bold text-lg">为商品增加库存数量</p>
                </div>

                <div class="mb-10 p-6 bg-slate-50 rounded-[2rem] border border-slate-100 flex items-center gap-6">
                    <div class="w-20 h-20 bg-white rounded-2xl overflow-hidden flex-shrink-0 flex items-center justify-center shadow-sm">
                        <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}" th:alt="${product.name}" class="w-full h-full object-cover">
                        <svg th:if="${product.imageUrl == null}" class="h-10 w-10 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg>
                    </div>
                    <div class="flex-1">
                        <h3 class="text-xl font-black text-slate-900 mb-2" th:text="${product.name}">商品名称</h3>
                        <div class="flex items-center gap-4">
                            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest" th:text="${'当前库存: ' + product.stock}">当前库存: 0</span>
                            <span class="text-primary-600 font-black" th:text="${product.requiredPoints + ' 积分'}">0 积分</span>
                        </div>
                    </div>
                </div>

                <form th:action="@{/admin/products/{id}/restock(id=${product.id})}" method="post" class="space-y-10">
                    <div>
                        <label for="addStock" class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1 mb-3">补货数量</label>
                        <input type="number" id="addStock" name="addStock" required min="1"
                               class="block w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-bold text-slate-900"
                               placeholder="请输入要增加的库存数量">
                        <p class="mt-3 text-xs font-bold text-slate-400">输入要增加的库存数量，库存将累加到当前库存</p>
                    </div>

                    <div class="pt-6 flex flex-col gap-4">
                        <button type="submit"
                                class="w-full py-5 bg-blue-600 text-white font-black rounded-2xl hover:bg-blue-700 shadow-vibrant hover:scale-[1.02] active:scale-[0.98] transition-all text-xl">
                            确认补货
                        </button>
                        <a href="/admin/products" class="w-full py-5 bg-slate-100 text-slate-700 font-black rounded-2xl hover:bg-slate-200 transition-all text-xl text-center">
                            返回列表
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
