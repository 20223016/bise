<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(title='用户管理', content=~{::div})}">
<body>
    <div class="space-y-8 pb-20">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-4xl font-black text-slate-900 tracking-tight mb-2">用户管理</h1>
                <p class="text-slate-500 font-bold">管理所有用户账号，包括启用/禁用操作</p>
            </div>
        </div>

        <!-- 提示消息 -->
        <div th:if="${success}" class="p-6 bg-green-50 border-2 border-green-100 text-green-700 rounded-3xl flex items-center shadow-sm">
            <div class="h-10 w-10 bg-white rounded-full flex items-center justify-center mr-4 shadow-sm">
                <svg class="h-6 w-6 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg>
            </div>
            <p class="font-black" th:text="${success}">操作成功</p>
        </div>

        <div th:if="${error}" class="p-6 bg-red-50 border-2 border-red-100 text-red-700 rounded-3xl flex items-center shadow-sm">
            <div class="h-10 w-10 bg-white rounded-full flex items-center justify-center mr-4 shadow-sm">
                <svg class="h-6 w-6 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" /></svg>
            </div>
            <p class="font-black" th:text="${error}">操作失败</p>
        </div>

        <div class="bg-white rounded-[2.5rem] shadow-soft border border-slate-100 overflow-hidden">
            <div class="p-8 border-b border-slate-100">
                <div class="flex items-center justify-between">
                    <h2 class="text-2xl font-black text-slate-900 tracking-tight">用户列表</h2>
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest" th:text="${users.size() + ' 个用户'}">0 个用户</span>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-100">
                    <thead>
                        <tr class="bg-slate-50/50">
                            <th class="px-8 py-5 text-left text-[10px] font-black text-slate-400 uppercase tracking-widest">用户信息</th>
                            <th class="px-8 py-5 text-left text-[10px] font-black text-slate-400 uppercase tracking-widest">角色</th>
                            <th class="px-8 py-5 text-left text-[10px] font-black text-slate-400 uppercase tracking-widest">积分</th>
                            <th class="px-8 py-5 text-left text-[10px] font-black text-slate-400 uppercase tracking-widest">状态</th>
                            <th class="px-8 py-5 text-right text-[10px] font-black text-slate-400 uppercase tracking-widest">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-50">
                        <tr th:each="user : ${users}" class="hover:bg-slate-50/50 transition-colors">
                            <td class="px-8 py-6">
                                <div class="flex items-center gap-4">
                                    <div class="h-10 w-10 rounded-xl bg-primary-100 flex items-center justify-center text-primary-700 font-black text-sm">
                                        <span th:text="${user.realName != null ? user.realName.substring(0,1).toUpperCase() : (user.username != null ? user.username.substring(0,1).toUpperCase() : 'U')}">U</span>
                                    </div>
                                    <div>
                                        <p class="text-sm font-black text-slate-900" th:text="${user.realName != null ? user.realName : (user.username != null ? user.username : '未知用户')}">用户名</p>
                                        <p class="text-[10px] font-bold text-slate-400" th:text="${user.username != null ? user.username : '未知'}">手机号</p>
                                    </div>
                                </div>
                            </td>
                            <td class="px-8 py-6">
                                <span th:switch="${user.role.name()}" class="px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-widest">
                                    <span th:case="'ADMIN'" class="bg-purple-50 text-purple-700 border border-purple-100">管理员</span>
                                    <span th:case="'VOLUNTEER'" class="bg-blue-50 text-blue-700 border border-blue-100">志愿者</span>
                                    <span th:case="'RESIDENT'" class="bg-green-50 text-green-700 border border-green-100">居民</span>
                                    <span th:case="*" class="bg-slate-50 text-slate-700 border border-slate-100">未知</span>
                                </span>
                            </td>
                            <td class="px-8 py-6">
                                <span class="text-sm font-black text-slate-900" th:text="${user.points}">0</span>
                            </td>
                            <td class="px-8 py-6">
                                <span th:if="${user.enabled}" class="px-3 py-1 bg-green-50 text-green-700 text-[10px] font-black uppercase tracking-widest rounded-lg border border-green-100">启用</span>
                                <span th:unless="${user.enabled}" class="px-3 py-1 bg-red-50 text-red-700 text-[10px] font-black uppercase tracking-widest rounded-lg border border-red-100">禁用</span>
                            </td>
                            <td class="px-8 py-6 whitespace-nowrap text-right">
                                <div class="flex items-center justify-end gap-2">
                                    <!-- 修改积分按钮 - 仅对非居民显示 -->
                                    <button th:if="${user.role.name() != 'RESIDENT'}"
                                            th:onclick="openPointsModal([[${user.id}]], [[${user.realName}]], [[${user.points}]])"
                                            class="px-4 py-2 bg-primary-50 text-primary-700 text-[10px] font-black uppercase tracking-widest rounded-xl border border-primary-100 hover:bg-primary-600 hover:text-white transition-all">
                                        修改积分
                                    </button>
                                    <form th:action="@{/admin/users/{id}/toggle(id=${user.id})}" method="post" class="inline">
                                        <button type="submit" th:if="${user.enabled}" class="px-4 py-2 bg-red-50 text-red-700 text-[10px] font-black uppercase tracking-widest rounded-xl border border-red-100 hover:bg-red-600 hover:text-white transition-all">
                                            禁用
                                        </button>
                                        <button type="submit" th:unless="${user.enabled}" class="px-4 py-2 bg-green-50 text-green-700 text-[10px] font-black uppercase tracking-widest rounded-xl border border-green-100 hover:bg-green-600 hover:text-white transition-all">
                                            启用
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 积分修改弹窗 -->
        <div id="pointsModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center">
            <div class="bg-white rounded-[2.5rem] shadow-2xl p-8 max-w-md w-full mx-4 transform transition-all">
                <div class="text-center mb-8">
                    <div class="h-16 w-16 bg-primary-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                        <svg class="h-8 w-8 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                    <h3 class="text-2xl font-black text-slate-900 mb-2">修改用户积分</h3>
                    <p class="text-slate-500 font-bold">用户: <span id="modalUserName" class="text-primary-600"></span></p>
                    <p class="text-slate-400 text-sm">当前积分: <span id="modalCurrentPoints" class="font-black text-slate-900"></span></p>
                </div>

                <form id="pointsForm" method="post">
                    <div class="space-y-6">
                        <div>
                            <label class="block text-sm font-black text-slate-700 mb-2">新积分值</label>
                            <input type="number" name="points" id="newPoints" min="0" required
                                   class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-black text-slate-900">
                        </div>
                        <div>
                            <label class="block text-sm font-black text-slate-700 mb-2">修改原因</label>
                            <input type="text" name="reason" required placeholder="例如：活动奖励、补偿等"
                                   class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-bold text-slate-900">
                        </div>
                    </div>

                    <div class="flex gap-3 mt-8">
                        <button type="button" onclick="closePointsModal()"
                                class="flex-1 py-3 bg-slate-100 text-slate-700 font-black rounded-2xl hover:bg-slate-200 transition-all">
                            取消
                        </button>
                        <button type="submit"
                                class="flex-1 py-3 bg-primary-600 text-white font-black rounded-2xl hover:bg-primary-700 transition-all shadow-vibrant">
                            确认修改
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            function openPointsModal(userId, userName, currentPoints) {
                document.getElementById('modalUserName').textContent = userName || '未知用户';
                document.getElementById('modalCurrentPoints').textContent = currentPoints || 0;
                document.getElementById('newPoints').value = currentPoints || 0;
                document.getElementById('pointsForm').action = '/admin/users/' + userId + '/points';
                document.getElementById('pointsModal').classList.remove('hidden');
                document.getElementById('pointsModal').classList.add('flex');
            }

            function closePointsModal() {
                document.getElementById('pointsModal').classList.add('hidden');
                document.getElementById('pointsModal').classList.remove('flex');
            }

            // 点击弹窗外部关闭
            document.getElementById('pointsModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closePointsModal();
                }
            });
        </script>
    </div>
</body>
</html>
