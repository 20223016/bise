<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="zh" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' - 管理后台' : '管理后台'}">管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        [x-cloak] { display: none !important; }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .nav-link-active { color: #0284c7; border-left: 4px solid #0284c7; background: rgba(2, 132, 199, 0.05); }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e', 950: '#082f49', }
                    },
                    borderRadius: { '2xl': '1rem', '3xl': '1.5rem', }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col selection:bg-primary-100 selection:text-primary-700">
    <!-- Top Navigation -->
    <nav class="glass-nav border-b border-slate-200/60 sticky top-0 z-50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20">
                <div class="flex items-center">
                    <div class="flex-shrink-0 flex items-center group">
                        <div class="h-10 w-10 bg-primary-600 rounded-xl flex items-center justify-center mr-3 shadow-vibrant group-hover:rotate-12 transition-transform">
                            <svg class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                        </div>
                        <a href="/admin" class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-primary-600 to-primary-800 bg-clip-text text-transparent">管理后台</a>
                    </div>
                </div>
                <div class="flex items-center space-x-6">
                    <div sec:authorize="isAuthenticated()" class="relative" x-data="{ profileOpen: false }">
                        <button @click="profileOpen = !profileOpen" type="button" class="flex items-center group p-1 pr-3 rounded-full hover:bg-slate-100 transition-all focus:outline-none">
                            <div class="h-10 w-10 rounded-full overflow-hidden bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center text-white font-black shadow-soft">
                                <img th:if="${#authentication.principal.avatarUrl != null}" th:src="${#authentication.principal.avatarUrl}" alt="avatar" class="h-10 w-10 object-cover">
                                <span th:if="${#authentication.principal.avatarUrl == null}" th:text="${#authentication.name.substring(0,1).toUpperCase()}">A</span>
                            </div>
                            <div class="ml-3 text-left">
                                <div class="text-sm font-bold text-slate-900 leading-tight" th:text="${#authentication.name}">管理员</div>
                                <div class="text-[10px] font-bold text-primary-600 uppercase tracking-wider">在线</div>
                            </div>
                            <svg class="ml-2 h-4 w-4 text-slate-400 group-hover:text-primary-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                        </button>
                        <div x-show="profileOpen" @click.away="profileOpen = false" x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition ease-in duration-75" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95" x-cloak class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg ring-1 ring-slate-200 py-2 z-50">
                            <a href="/admin/profile" class="block px-4 py-2 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-primary-600 transition-colors">个人资料</a>
                            <a href="/logout" class="block px-4 py-2 text-sm font-bold text-red-600 hover:bg-red-50 transition-colors">退出登录</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="flex flex-1">
        <!-- Sidebar -->
        <aside class="w-64 bg-white border-r border-slate-200 hidden md:block">
            <div class="h-full flex flex-col">
                <nav class="flex-1 px-4 py-6 space-y-1">
                    <a href="/admin" class="flex items-center px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-primary-600 transition-colors rounded-lg nav-link-active">
                        <svg class="h-5 w-5 mr-3 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                        工作台
                    </a>
                    <a href="/admin/users" class="flex items-center px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-primary-600 transition-colors rounded-lg">
                        <svg class="h-5 w-5 mr-3 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                        用户管理
                    </a>
                    <a href="/admin/demands" class="flex items-center px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-primary-600 transition-colors rounded-lg">
                        <svg class="h-5 w-5 mr-3 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        需求管理
                    </a>
                    <a href="/admin/activities" class="flex items-center px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-primary-600 transition-colors rounded-lg">
                        <svg class="h-5 w-5 mr-3 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                        活动管理
                    </a>
                    <a href="/admin/comments" class="flex items-center px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-primary-600 transition-colors rounded-lg">
                        <svg class="h-5 w-5 mr-3 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
                        评论管理
                    </a>
                    <a href="/admin/announcements" class="flex items-center px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-primary-600 transition-colors rounded-lg">
                        <svg class="h-5 w-5 mr-3 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z" /></svg>
                        通知管理
                    </a>
                    <a href="/register-admin" class="flex items-center px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-primary-600 transition-colors rounded-lg">
                        <svg class="h-5 w-5 mr-3 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" /></svg>
                        管理员注册
                    </a>
                    <a href="/admin/products" class="flex items-center px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-primary-600 transition-colors rounded-lg">
                        <svg class="h-5 w-5 mr-3 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg>
                        商品管理
                    </a>
                    <a href="/admin/reports" class="flex items-center px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 hover:text-primary-600 transition-colors rounded-lg">
                        <svg class="h-5 w-5 mr-3 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                        数据统计
                    </a>
                </nav>
            </div>
        </aside>

        <!-- Content Area -->
        <main class="flex-1 px-4 sm:px-6 lg:px-8 py-10">
            <div class="max-w-7xl mx-auto" th:insert="${content}"></div>
        </main>
    </div>
</body>
</html>
