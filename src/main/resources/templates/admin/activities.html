<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(title='活动管理', content=~{::div})}">
<body>
    <div class="space-y-8 pb-20">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-4xl font-black text-slate-900 tracking-tight mb-2">活动管理</h1>
                <p class="text-slate-500 font-bold">管理所有志愿活动，包括删除操作</p>
            </div>
            <a href="/admin/activities/new" class="inline-flex items-center px-6 py-3 bg-primary-600 text-white text-sm font-black rounded-xl hover:bg-primary-700 transition-all shadow-vibrant">
                <svg class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                发布活动
            </a>
        </div>

        <div th:if="${param.activity_created}" class="p-4 bg-green-50 rounded-2xl border border-green-100 flex items-center gap-3">
            <svg class="h-5 w-5 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            <p class="text-sm font-bold text-green-600">活动发布成功</p>
        </div>

        <div th:if="${param.activity_deleted}" class="p-4 bg-green-50 rounded-2xl border border-green-100 flex items-center gap-3">
            <svg class="h-5 w-5 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            <p class="text-sm font-bold text-green-600">活动删除成功</p>
        </div>

        <div class="bg-white rounded-[2.5rem] shadow-soft border border-slate-100 overflow-hidden">
            <div class="p-8 border-b border-slate-100">
                <div class="flex items-center justify-between">
                    <h2 class="text-2xl font-black text-slate-900 tracking-tight">活动列表</h2>
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest" th:text="${activities.size() + ' 个活动'}">0 个活动</span>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-100">
                    <thead>
                        <tr class="bg-slate-50/50">
                            <th class="px-8 py-5 text-left text-[10px] font-black text-slate-400 uppercase tracking-widest">活动信息</th>
                            <th class="px-8 py-5 text-left text-[10px] font-black text-slate-400 uppercase tracking-widest">时间地点</th>
                            <th class="px-8 py-5 text-left text-[10px] font-black text-slate-400 uppercase tracking-widest">招募情况</th>
                            <th class="px-8 py-5 text-left text-[10px] font-black text-slate-400 uppercase tracking-widest">状态</th>
                            <th class="px-8 py-5 text-right text-[10px] font-black text-slate-400 uppercase tracking-widest">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-50">
                        <tr th:each="activity : ${activities}" class="hover:bg-slate-50/50 transition-colors">
                            <td class="px-8 py-6">
                                <div class="flex items-start gap-4">
                                    <div th:if="${activity.imageUrl}" class="h-16 w-16 rounded-xl overflow-hidden flex-shrink-0">
                                        <img th:src="${activity.imageUrl}" alt="活动图片" class="h-full w-full object-cover">
                                    </div>
                                    <div th:unless="${activity.imageUrl}" class="h-16 w-16 rounded-xl bg-slate-100 flex items-center justify-center flex-shrink-0">
                                        <svg class="h-8 w-8 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                                    </div>
                                    <div>
                                        <p class="text-sm font-black text-slate-900 line-clamp-2" th:text="${activity.title != null ? activity.title : '未命名活动'}">活动标题</p>
                                        <p class="text-[10px] font-bold text-slate-400 mt-1" th:if="${activity.basePoints != null}" th:text="${'每小时 ' + activity.basePoints + ' 积分'}">每小时 10 积分</p>
                                    </div>
                                </div>
                            </td>
                            <td class="px-8 py-6">
                                <p class="text-sm font-black text-slate-900" th:text="${activity.startTime != null ? #temporals.format(activity.startTime, 'yyyy-MM-dd HH:mm') : '未设置'}">2024-01-01 09:00</p>
                                <p class="text-[10px] font-bold text-slate-400 mt-1" th:text="${activity.location != null ? activity.location : '未设置'}">活动地点</p>
                            </td>
                            <td class="px-8 py-6">
                                <div class="flex items-center gap-2">
                                    <span class="text-sm font-black text-slate-900 w-16" th:text="${(activity.enrolledNumber != null ? activity.enrolledNumber : 0) + '/' + (activity.recruitNumber != null ? activity.recruitNumber : 0)}">0/10</span>
                                    <div class="flex-grow max-w-[120px] bg-slate-100 rounded-full h-2 overflow-hidden">
                                        <div class="bg-primary-600 h-full rounded-full transition-all duration-500" th:style="|width: ${activity.progressPercentage}%|" style="width: 0%"></div>
                                    </div>
                                </div>
                            </td>
                            <td class="px-8 py-6">
                                <span th:switch="${activity.status != null ? activity.status.name() : 'UNKNOWN'}" class="px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-widest">
                                    <span th:case="'DRAFT'" class="bg-slate-50 text-slate-700 border border-slate-100">草稿</span>
                                    <span th:case="'PUBLISHED'" class="bg-blue-50 text-blue-700 border border-blue-100">已发布</span>
                                    <span th:case="'ONGOING'" class="bg-green-50 text-green-700 border border-green-100">进行中</span>
                                    <span th:case="'FINISHED'" class="bg-purple-50 text-purple-700 border border-purple-100">已结束</span>
                                    <span th:case="'CANCELLED'" class="bg-red-50 text-red-700 border border-red-100">已取消</span>
                                    <span th:case="*" class="bg-slate-50 text-slate-700 border border-slate-100">未知</span>
                                </span>
                            </td>
                            <td class="px-8 py-6 whitespace-nowrap text-right">
                                <form th:action="@{/admin/activities/{id}/delete(id=${activity.id})}" method="post">
                                    <button type="submit" class="px-4 py-2 bg-red-50 text-red-700 text-[10px] font-black uppercase tracking-widest rounded-xl border border-red-100 hover:bg-red-600 hover:text-white transition-all" onclick="return confirm('确定要删除这个活动吗？');">
                                        删除
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
