<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(title='忘记密码', content=~{::div.forgot-password-container})}">
<head>
    <title>忘记密码 - 社区志愿者服务系统</title>
</head>
<body>
    <div class="forgot-password-container min-h-[80vh] flex items-center justify-center py-12 px-4">
        <div class="max-w-md w-full space-y-8 bg-white p-10 md:p-16 rounded-[3rem] shadow-soft border border-slate-100 relative overflow-hidden">
            <div class="absolute top-0 left-0 -mt-12 -ml-12 h-40 w-40 bg-primary-50 rounded-full blur-3xl opacity-50"></div>
            
            <div class="relative">
                <div class="text-center mb-10">
                    <div class="mx-auto h-16 w-16 bg-primary-600 rounded-2xl flex items-center justify-center mb-6 shadow-vibrant">
                        <svg class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a2 2 0 01-2-2v-2.343a6 6 0 015.743-5.743L10 9m6 10h.01M12 12h.01M12 7h.01M12 3h.01" />
                        </svg>
                    </div>
                    <h2 class="text-3xl font-black text-slate-900 tracking-tight">忘记密码</h2>
                    <p class="mt-3 text-slate-500 font-bold">验证身份后重置密码</p>
                </div>

                <!-- 错误/成功提示 -->
                <div th:if="${error}" class="mb-6 p-4 bg-red-50 rounded-2xl border border-red-100 flex items-center gap-3">
                    <svg class="h-5 w-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    <p class="text-sm font-bold text-red-600" th:text="${error}">错误信息</p>
                </div>

                <div th:if="${success}" class="mb-6 p-4 bg-green-50 rounded-2xl border border-green-100 flex items-center gap-3">
                    <svg class="h-5 w-5 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    <p class="text-sm font-bold text-green-600" th:text="${success}">成功信息</p>
                </div>

                <!-- 步骤 1：验证身份 -->
                <div th:if="${step == 1 || step == null}" class="space-y-6">
                    <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4">
                        <p class="text-sm font-bold text-blue-700">
                            <span class="font-black">步骤 1/2</span> - 验证您的身份
                        </p>
                    </div>

                    <form th:action="@{/forgot-password}" method="POST" class="space-y-6">
                        <div>
                            <label for="username" class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1 mb-2">用户名</label>
                            <div class="relative group">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary-600 transition-colors">
                                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                                </div>
                                <input id="username" name="username" type="text" required 
                                       class="block w-full pl-11 pr-4 py-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-bold text-slate-900" 
                                       placeholder="请输入您的用户名">
                            </div>
                        </div>

                        <div>
                            <label for="idCard" class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1 mb-2">身份证号</label>
                            <div class="relative group">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary-600 transition-colors">
                                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2" /></svg>
                                </div>
                                <input id="idCard" name="idCard" type="text" required 
                                       class="block w-full pl-11 pr-4 py-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-bold text-slate-900" 
                                       placeholder="请输入您的身份证号">
                            </div>
                        </div>

                        <div>
                            <button type="submit" class="group relative w-full flex justify-center py-4 px-4 border border-transparent text-lg font-black rounded-2xl text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 shadow-vibrant transition-all hover:scale-[1.02] active:scale-[0.98]">
                                验证身份
                            </button>
                        </div>
                    </form>
                </div>

                <!-- 步骤 2：重置密码 -->
                <div th:if="${step == 2}" class="space-y-6">
                    <div class="bg-green-50 border border-green-100 rounded-2xl p-4">
                        <p class="text-sm font-bold text-green-700">
                            <span class="font-black">步骤 2/2</span> - 设置新密码
                        </p>
                    </div>

                    <form th:action="@{/forgot-password/reset}" method="POST" class="space-y-6">
                        <input type="hidden" name="username" th:value="${username}">

                        <div>
                            <label for="newPassword" class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1 mb-2">新密码</label>
                            <div class="relative group">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary-600 transition-colors">
                                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                                </div>
                                <input id="newPassword" name="newPassword" type="password" required minlength="6"
                                       class="block w-full pl-11 pr-4 py-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-bold text-slate-900" 
                                       placeholder="请输入新密码（至少6位）">
                            </div>
                        </div>

                        <div>
                            <label for="confirmPassword" class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1 mb-2">确认密码</label>
                            <div class="relative group">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary-600 transition-colors">
                                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                                </div>
                                <input id="confirmPassword" name="confirmPassword" type="password" required minlength="6"
                                       class="block w-full pl-11 pr-4 py-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-bold text-slate-900" 
                                       placeholder="请再次输入新密码">
                            </div>
                        </div>

                        <div>
                            <button type="submit" class="group relative w-full flex justify-center py-4 px-4 border border-transparent text-lg font-black rounded-2xl text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 shadow-vibrant transition-all hover:scale-[1.02] active:scale-[0.98]">
                                重置密码
                            </button>
                        </div>
                    </form>
                </div>

                <div class="mt-8 pt-8 border-t border-slate-100 text-center">
                    <p class="text-sm font-bold text-slate-500">
                        想起密码了？
                        <a href="/login" class="text-primary-600 hover:text-primary-500 ml-1">返回登录</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
