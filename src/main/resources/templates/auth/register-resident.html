<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(title='居民注册', content=~{::div.register-container})}">
<body>
    <div class="register-container min-h-[80vh] flex items-center justify-center py-12 px-4">
        <div class="max-w-2xl w-full space-y-10 bg-white p-10 md:p-16 rounded-[3rem] shadow-soft border border-slate-100 relative overflow-hidden">
            <div class="absolute top-0 left-0 -mt-12 -ml-12 h-40 w-40 bg-primary-50 rounded-full blur-3xl opacity-50"></div>

            <div class="relative">
                <div class="text-center">
                    <div class="mx-auto h-16 w-16 bg-primary-600 rounded-2xl flex items-center justify-center mb-6 shadow-vibrant">
                        <span class="text-3xl">🏠</span>
                    </div>
                    <h2 class="text-4xl font-black text-slate-900 tracking-tight">社区居民注册</h2>
                    <p class="mt-4 text-slate-500 font-bold text-lg">注册后可发布求助任务并查看匹配进度</p>
                </div>

                <form th:action="@{/register}" method="post" class="mt-12 space-y-10">
                    <input type="hidden" name="role" value="RESIDENT">

                    <div class="space-y-8">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div>
                                <label for="username" class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1 mb-2">手机号（作为登录账号）</label>
                                <input type="text" id="username" name="username" required
                                       class="block w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-bold text-slate-900"
                                       placeholder="138xxxx8888">
                            </div>
                            <div>
                                <label for="realName" class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1 mb-2">真实姓名</label>
                                <input type="text" id="realName" name="realName" required
                                       class="block w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-bold text-slate-900"
                                       placeholder="张三">
                            </div>
                        </div>

                        <div>
                            <label for="idCard" class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1 mb-2">身份证号（实名认证）</label>
                            <input type="text" id="idCard" name="idCard" required
                                   class="block w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-bold text-slate-900"
                                   placeholder="请输入18位身份证号">
                        </div>

                        <div>
                            <label for="password" class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1 mb-2">设置登录密码</label>
                            <input type="password" id="password" name="password" required
                                   class="block w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-bold text-slate-900"
                                   placeholder="不少于6位字符">
                        </div>
                    </div>

                    <button type="submit"
                            class="w-full py-5 bg-primary-600 text-white font-black rounded-2xl hover:bg-primary-700 shadow-vibrant hover:scale-[1.02] active:scale-[0.98] transition-all text-xl">
                        立即创建账号
                    </button>

                    <div class="pt-8 border-t border-slate-100 text-center space-y-4">
                        <a href="/register" class="text-slate-500 font-black text-sm hover:text-slate-700 underline underline-offset-4 decoration-2 decoration-slate-200">返回身份选择</a>
                        <p class="text-sm font-bold text-slate-500">
                            已有账号？ <a href="/login" class="text-primary-600 hover:text-primary-700 underline underline-offset-4 decoration-2 decoration-primary-200">直接登录</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
