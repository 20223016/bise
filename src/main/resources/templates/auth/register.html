<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(title='注册', content=~{::div.register-container})}">
<body>
    <div class="register-container min-h-[80vh] flex items-center justify-center py-12 px-4">
        <div class="max-w-2xl w-full space-y-10 bg-white p-10 md:p-16 rounded-[3rem] shadow-soft border border-slate-100 relative overflow-hidden">
            <div class="absolute top-0 left-0 -mt-12 -ml-12 h-40 w-40 bg-primary-50 rounded-full blur-3xl opacity-50"></div>
            
            <div class="relative">
                <div class="text-center">
                    <h2 class="text-4xl font-black text-slate-900 tracking-tight">开启公益之旅</h2>
                    <p class="mt-4 text-slate-500 font-bold text-lg">请选择注册身份</p>
                </div>

                <div class="mt-12 grid grid-cols-1 md:grid-cols-2 gap-6">
                    <a href="/register/volunteer" class="group bg-slate-50 border-2 border-transparent hover:border-primary-300 rounded-[2rem] p-10 transition-all hover:shadow-md">
                        <div class="h-14 w-14 bg-white rounded-2xl flex items-center justify-center mb-6 shadow-sm group-hover:scale-110 transition-transform">
                            <span class="text-3xl">🙋‍♂️</span>
                        </div>
                        <h3 class="text-2xl font-black text-slate-900 mb-3">注册为志愿者</h3>
                        <p class="text-slate-500 font-bold leading-relaxed">完善技能标签与可服务时间，参与活动与互助。</p>
                        <div class="mt-8 inline-flex items-center text-primary-700 font-black text-sm">
                            去注册
                            <span class="ml-2 transition-transform group-hover:translate-x-1">→</span>
                        </div>
                    </a>

                    <a href="/register/resident" class="group bg-slate-50 border-2 border-transparent hover:border-primary-300 rounded-[2rem] p-10 transition-all hover:shadow-md">
                        <div class="h-14 w-14 bg-white rounded-2xl flex items-center justify-center mb-6 shadow-sm group-hover:scale-110 transition-transform">
                            <span class="text-3xl">🏠</span>
                        </div>
                        <h3 class="text-2xl font-black text-slate-900 mb-3">注册为社区居民</h3>
                        <p class="text-slate-500 font-bold leading-relaxed">发布求助任务，系统将匹配最合适的志愿者。</p>
                        <div class="mt-8 inline-flex items-center text-primary-700 font-black text-sm">
                            去注册
                            <span class="ml-2 transition-transform group-hover:translate-x-1">→</span>
                        </div>
                    </a>
                </div>

                <div class="mt-10 pt-8 border-t border-slate-100 text-center">
                    <p class="text-sm font-bold text-slate-500">
                        已有账号？ <a href="/login" class="text-primary-600 hover:text-primary-700 underline underline-offset-4 decoration-2 decoration-primary-200">直接登录</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
