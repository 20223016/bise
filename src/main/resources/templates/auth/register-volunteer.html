<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(title='志愿者注册', content=~{::div.register-container})}">
<body>
    <div class="register-container min-h-[80vh] flex items-center justify-center py-12 px-4">
        <div class="max-w-3xl w-full space-y-10 bg-white p-10 md:p-16 rounded-[3rem] shadow-soft border border-slate-100 relative overflow-hidden">
            <div class="absolute top-0 left-0 -mt-12 -ml-12 h-40 w-40 bg-primary-50 rounded-full blur-3xl opacity-50"></div>

            <div class="relative">
                <div class="text-center">
                    <div class="mx-auto h-16 w-16 bg-primary-600 rounded-2xl flex items-center justify-center mb-6 shadow-vibrant">
                        <span class="text-3xl">🙋‍♂️</span>
                    </div>
                    <h2 class="text-4xl font-black text-slate-900 tracking-tight">志愿者注册</h2>
                    <p class="mt-4 text-slate-500 font-bold text-lg">完善技能标签与可服务时间，申请审核通过后可接单</p>
                </div>

                <form th:action="@{/register}" method="post" class="mt-12 space-y-10">
                    <input type="hidden" name="role" value="VOLUNTEER">

                    <div class="space-y-8">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div>
                                <label for="username" class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1 mb-2">手机号（作为登录账号）</label>
                                <input type="text" id="username" name="username" required
                                       class="block w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-bold text-slate-900"
                                       placeholder="138xxxx8888">
                            </div>
                            <div>
                                <label for="realName" class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1 mb-2">真实姓名</label>
                                <input type="text" id="realName" name="realName" required
                                       class="block w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-bold text-slate-900"
                                       placeholder="张三">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div>
                                <label for="idCard" class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1 mb-2">身份证号（实名认证）</label>
                                <input type="text" id="idCard" name="idCard" required
                                       class="block w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-bold text-slate-900"
                                       placeholder="请输入18位身份证号">
                            </div>
                            <div>
                                <label for="password" class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1 mb-2">设置登录密码</label>
                                <input type="password" id="password" name="password" required
                                       class="block w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-bold text-slate-900"
                                       placeholder="不少于6位字符">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div>
                                <label for="contactNumber" class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1 mb-2">联系方式（可选）</label>
                                <input type="text" id="contactNumber" name="contactNumber"
                                       class="block w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-bold text-slate-900"
                                       placeholder="用于联系（可与手机号一致）">
                            </div>
                            <div>
                                <label for="availableTimeSlots" class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1 mb-2">可服务时间（可选）</label>
                                <input type="text" id="availableTimeSlots" name="availableTimeSlots"
                                       class="block w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-bold text-slate-900"
                                       placeholder="如：周一至周五 18:00-20:00">
                            </div>
                        </div>

                        <div class="bg-primary-50/50 p-8 rounded-[2rem] border border-primary-100">
                            <label class="block text-sm font-black text-primary-800 mb-6 flex items-center">
                                <svg class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" /></svg>
                                您的特长技能（可多选）
                            </label>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <label class="relative flex items-center p-4 bg-white rounded-xl border-2 border-transparent hover:border-primary-300 cursor-pointer transition-all shadow-sm has-[:checked]:border-primary-600 has-[:checked]:bg-primary-50">
                                    <input type="checkbox" name="skills" value="医疗急救" class="h-5 w-5 rounded-lg border-2 border-slate-200 text-primary-600 focus:ring-primary-500 transition-all">
                                    <span class="ml-3 text-sm font-bold text-slate-600">医疗急救</span>
                                </label>
                                <label class="relative flex items-center p-4 bg-white rounded-xl border-2 border-transparent hover:border-primary-300 cursor-pointer transition-all shadow-sm has-[:checked]:border-primary-600 has-[:checked]:bg-primary-50">
                                    <input type="checkbox" name="skills" value="家电维修" class="h-5 w-5 rounded-lg border-2 border-slate-200 text-primary-600 focus:ring-primary-500 transition-all">
                                    <span class="ml-3 text-sm font-bold text-slate-600">家电维修</span>
                                </label>
                                <label class="relative flex items-center p-4 bg-white rounded-xl border-2 border-transparent hover:border-primary-300 cursor-pointer transition-all shadow-sm has-[:checked]:border-primary-600 has-[:checked]:bg-primary-50">
                                    <input type="checkbox" name="skills" value="心理疏导" class="h-5 w-5 rounded-lg border-2 border-slate-200 text-primary-600 focus:ring-primary-500 transition-all">
                                    <span class="ml-3 text-sm font-bold text-slate-600">心理疏导</span>
                                </label>
                                <label class="relative flex items-center p-4 bg-white rounded-xl border-2 border-transparent hover:border-primary-300 cursor-pointer transition-all shadow-sm has-[:checked]:border-primary-600 has-[:checked]:bg-primary-50">
                                    <input type="checkbox" name="skills" value="课业辅导" class="h-5 w-5 rounded-lg border-2 border-slate-200 text-primary-600 focus:ring-primary-500 transition-all">
                                    <span class="ml-3 text-sm font-bold text-slate-600">课业辅导</span>
                                </label>
                                <label class="relative flex items-center p-4 bg-white rounded-xl border-2 border-transparent hover:border-primary-300 cursor-pointer transition-all shadow-sm has-[:checked]:border-primary-600 has-[:checked]:bg-primary-50">
                                    <input type="checkbox" name="skills" value="法律咨询" class="h-5 w-5 rounded-lg border-2 border-slate-200 text-primary-600 focus:ring-primary-500 transition-all">
                                    <span class="ml-3 text-sm font-bold text-slate-600">法律咨询</span>
                                </label>
                                <label class="relative flex items-center p-4 bg-white rounded-xl border-2 border-transparent hover:border-primary-300 cursor-pointer transition-all shadow-sm has-[:checked]:border-primary-600 has-[:checked]:bg-primary-50">
                                    <input type="checkbox" name="skills" value="环境保护" class="h-5 w-5 rounded-lg border-2 border-slate-200 text-primary-600 focus:ring-primary-500 transition-all">
                                    <span class="ml-3 text-sm font-bold text-slate-600">环境保护</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <button type="submit"
                            class="w-full py-5 bg-primary-600 text-white font-black rounded-2xl hover:bg-primary-700 shadow-vibrant hover:scale-[1.02] active:scale-[0.98] transition-all text-xl">
                        立即创建账号
                    </button>

                    <div class="pt-8 border-t border-slate-100 text-center space-y-4">
                        <a href="/register" class="text-slate-500 font-black text-sm hover:text-slate-700 underline underline-offset-4 decoration-2 decoration-slate-200">返回身份选择</a>
                        <p class="text-sm font-bold text-slate-500">
                            已有账号？ <a href="/login" class="text-primary-600 hover:text-primary-700 underline underline-offset-4 decoration-2 decoration-primary-200">直接登录</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
