<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(title='积分兑换', content=~{::section})}">
<body>
    <section class="space-y-12">
        <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-8">
            <div class="max-w-2xl">
                <h1 class="text-4xl md:text-5xl font-black text-slate-900 tracking-tight mb-4">积分兑换中心</h1>
                <p class="text-lg text-slate-500 font-bold leading-relaxed">您的每一份汗水都值得被奖励。使用志愿服务积分，换取社区为您准备的精选礼品与服务。</p>
            </div>
            
            <div sec:authorize="isAuthenticated()" class="relative" x-data="{ menuOpen: false }">
                <button @click="menuOpen = !menuOpen" class="bg-primary-900 px-8 py-6 rounded-[2rem] shadow-vibrant flex items-center group hover:scale-105 transition-transform duration-500 w-full">
                    <div class="mr-6">
                        <p class="text-[10px] font-black text-primary-400 uppercase tracking-[0.2em] mb-1">我的可用积分</p>
                        <div class="flex items-baseline gap-2">
                            <span class="text-4xl font-black text-white tracking-tighter" th:text="${#authentication.principal.points}">0</span>
                            <span class="text-xs font-black text-primary-300 uppercase tracking-widest">Points</span>
                        </div>
                    </div>
                    <div class="h-12 w-12 bg-white/10 rounded-2xl flex items-center justify-center text-primary-400 group-hover:rotate-12 transition-transform">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </div>
                    <svg class="ml-4 h-5 w-5 text-primary-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
                
                <!-- 下拉菜单 -->
                <div x-show="menuOpen" @click.away="menuOpen = false" x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition ease-in duration-75" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95" x-cloak
                     class="absolute right-0 mt-3 w-56 rounded-2xl shadow-xl py-2 bg-white ring-1 ring-black ring-opacity-5 divide-y divide-slate-100 focus:outline-none overflow-hidden z-50">
                    <div class="py-1">
                        <a href="/points" class="flex items-center px-4 py-2.5 text-sm text-slate-700 hover:bg-primary-50 hover:text-primary-700 transition-colors">
                            <svg class="h-4 w-4 mr-3 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                            </svg>
                            积分明细
                        </a>
                        <form th:action="@{/points/sign-in}" method="post" class="w-full">
                            <button type="submit" class="w-full flex items-center px-4 py-2.5 text-sm text-slate-700 hover:bg-primary-50 hover:text-primary-700 transition-colors">
                                <svg class="h-4 w-4 mr-3 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                每日签到
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Alerts -->
        <div th:if="${param.success}" class="p-6 bg-green-50 border-2 border-green-100 text-green-700 rounded-3xl flex items-center shadow-sm">
            <div class="h-10 w-10 bg-white rounded-full flex items-center justify-center mr-4 shadow-sm">
                <svg class="h-6 w-6 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg>
            </div>
            <p class="font-black">兑换申请已提交！请前往个人中心查看详情。</p>
        </div>

        <div th:if="${param.error}" class="p-6 bg-red-50 border-2 border-red-100 text-red-700 rounded-3xl flex items-center shadow-sm animate-shake">
            <div class="h-10 w-10 bg-white rounded-full flex items-center justify-center mr-4 shadow-sm">
                <svg class="h-6 w-6 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" /></svg>
            </div>
            <p class="font-black">兑换失败：<span th:text="${param.error}">错误信息</span></p>
        </div>

        <div th:if="${products.empty}" class="bg-white p-20 rounded-[3rem] shadow-soft border border-slate-100 text-center">
            <div class="h-24 w-24 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-8">
                <span class="text-5xl">🎁</span>
            </div>
            <h3 class="text-2xl font-black text-slate-900 mb-4">商品正在上架中</h3>
            <p class="text-slate-500 font-bold max-w-sm mx-auto">兑换中心正在更新一批精选礼品，请耐心等待。</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10">
            <div th:each="product : ${products}" 
                 class="group bg-white rounded-[2.5rem] shadow-soft border border-slate-100 overflow-hidden hover:shadow-xl transition-all duration-500 flex flex-col">
                <div class="relative h-64 bg-slate-50 overflow-hidden">
                    <div class="absolute inset-0 flex items-center justify-center text-slate-200">
                        <svg th:if="${product.imageUrl == null}" class="h-24 w-24 opacity-30" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg>
                        <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}" th:alt="${product.name}" th:class="${product.stock <= 0 ? 'h-full w-full object-cover grayscale opacity-50' : 'h-full w-full object-cover transition-transform duration-700 group-hover:scale-110'}" th:style="${product.stock <= 0 ? 'filter: grayscale(100%); opacity: 0.5;' : ''}">
                    </div>
                    <div class="absolute top-6 left-6">
                        <span th:if="${product.stock > 0}" class="px-4 py-1.5 bg-white/90 backdrop-blur-md rounded-xl text-[10px] font-black uppercase tracking-widest text-primary-700 shadow-sm" th:text="${'库存: ' + product.stock}">库存: 0</span>
                        <span th:if="${product.stock <= 0}" class="px-4 py-1.5 bg-red-100 text-red-700 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-sm">已兑换完</span>
                    </div>
                </div>
                
                <div class="p-8 flex-grow flex flex-col">
                    <h3 th:text="${product.name}" class="text-2xl font-black text-slate-900 mb-3 group-hover:text-primary-600 transition-colors">商品名称</h3>
                    <p th:text="${product.description}" class="text-slate-500 font-bold text-sm mb-8 line-clamp-2 leading-relaxed">商品描述...</p>
                    
                    <div class="mt-auto pt-6 border-t border-slate-50">
                        <div class="flex items-center justify-between mb-8">
                            <div class="flex items-baseline gap-1">
                                <span th:text="${product.requiredPoints}" class="text-3xl font-black text-primary-600 tracking-tighter">0</span>
                                <span class="text-[10px] font-black text-primary-400 uppercase tracking-widest">积分</span>
                            </div>
                        </div>
                        
                        <div th:with="userPoints=${#authentication.principal.points}, requiredPoints=${product.requiredPoints}, hasEnoughPoints=${userPoints >= requiredPoints}">
                            <div th:if="${!hasEnoughPoints}" class="mb-4 p-4 bg-orange-50 border-2 border-orange-100 rounded-2xl">
                                <div class="flex items-center gap-3">
                                    <div class="h-10 w-10 bg-orange-100 rounded-xl flex items-center justify-center flex-shrink-0">
                                        <svg class="h-5 w-5 text-orange-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                                        </svg>
                                    </div>
                                    <div>
                                        <p class="text-sm font-black text-orange-700">积分不足</p>
                                        <p class="text-xs text-orange-600 font-bold">还差 <span th:text="${requiredPoints - userPoints}">0</span> 积分，多多服务赚取积分吧！</p>
                                    </div>
                                </div>
                            </div>
                            <form th:action="@{/redemption/{id}(id=${product.id})}" method="post">
                                <input type="hidden" name="quantity" value="1">
                                <button type="submit"
                                        th:disabled="${product.stock <= 0 || !hasEnoughPoints}"
                                        class="w-full py-4 bg-slate-900 text-white font-black rounded-2xl hover:bg-primary-600 transition-all shadow-sm disabled:bg-slate-100 disabled:text-slate-300 disabled:shadow-none disabled:cursor-not-allowed">
                                    <span th:if="${product.stock > 0 && hasEnoughPoints}">立即兑换</span>
                                    <span th:if="${product.stock > 0 && !hasEnoughPoints}">积分不足</span>
                                    <span th:if="${product.stock <= 0}">暂时缺货</span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
