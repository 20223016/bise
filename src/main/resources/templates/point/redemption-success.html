<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(title='兑换成功', content=~{::section})}">
<body>
    <section class="max-w-4xl mx-auto">
        <div class="bg-white rounded-[3rem] shadow-soft border border-slate-100 overflow-hidden">
            <!-- 顶部成功标识 -->
            <div class="bg-gradient-to-br from-green-500 to-green-600 p-12 text-center">
                <div class="h-24 w-24 bg-white rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg">
                    <svg class="h-12 w-12 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
                <h1 class="text-3xl md:text-4xl font-black text-white tracking-tight mb-2">兑换成功！</h1>
                <p class="text-green-100 font-bold text-lg">感谢您的志愿服务</p>
            </div>

            <!-- 感谢信息 -->
            <div class="p-10 md:p-16 text-center">
                <div class="mb-10">
                    <p class="text-2xl font-black text-slate-900 mb-4">
                        感谢您对志愿服务的支持！
                    </p>
                    <p class="text-slate-500 font-bold text-lg leading-relaxed max-w-lg mx-auto">
                        您的每一份付出都在让社区变得更美好。我们已收到您的兑换申请，将尽快为您安排发货。
                    </p>
                </div>

                <!-- 兑换详情 -->
                <div class="bg-slate-50 rounded-[2rem] p-8 mb-10 max-w-md mx-auto">
                    <h3 class="text-lg font-black text-slate-900 mb-6">兑换详情</h3>
                    <div class="space-y-4 text-left">
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500 font-bold">商品名称</span>
                            <span class="text-slate-900 font-black" th:text="${redemption.product.name}">商品</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500 font-bold">兑换数量</span>
                            <span class="text-slate-900 font-black" th:text="${redemption.quantity + ' 件'}">1 件</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500 font-bold">消耗积分</span>
                            <span class="text-primary-600 font-black" th:text="${redemption.totalPoints + ' 积分'}">100 积分</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500 font-bold">兑换时间</span>
                            <span class="text-slate-900 font-black" th:text="${#temporals.format(redemption.redemptionTime, 'yyyy-MM-dd HH:mm')}">2024-01-01</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500 font-bold">订单状态</span>
                            <span class="px-3 py-1 bg-yellow-100 text-yellow-700 text-xs font-black uppercase tracking-widest rounded-lg">处理中</span>
                        </div>
                    </div>
                </div>

                <!-- 醒目图片 -->
                <div class="mb-10">
                    <div class="rounded-[2rem] overflow-hidden border-4 border-primary-100 shadow-lg max-w-lg mx-auto">
                        <img src="/imp/1.png" alt="感谢支持" class="w-full object-cover">
                    </div>
                    <p class="mt-4 text-sm text-slate-400 font-bold">志愿服务，温暖社区</p>
                </div>

                <!-- 操作按钮 -->
                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <a href="/redemption" class="inline-flex items-center justify-center px-8 py-4 bg-slate-900 text-white font-black rounded-2xl hover:bg-primary-600 transition-all shadow-sm">
                        <svg class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                        </svg>
                        继续兑换
                    </a>
                    <a href="/points" class="inline-flex items-center justify-center px-8 py-4 bg-white text-slate-700 font-black rounded-2xl border-2 border-slate-200 hover:border-primary-500 hover:text-primary-600 transition-all">
                        <svg class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                        </svg>
                        查看积分明细
                    </a>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
