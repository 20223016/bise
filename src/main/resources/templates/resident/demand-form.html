<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout/main :: layout(title='发布需求', content=~{::section})}">
<body>
    <section class="max-w-3xl mx-auto py-12 px-4">
        <div class="bg-white p-10 md:p-16 rounded-[3rem] shadow-soft border border-slate-100 relative overflow-hidden">
            <div class="absolute top-0 right-0 -mt-12 -mr-12 h-40 w-40 bg-primary-50 rounded-full blur-3xl opacity-50"></div>
            
            <div class="relative">
                <div class="text-center mb-12">
                    <div class="mx-auto h-16 w-16 bg-primary-600 rounded-2xl flex items-center justify-center mb-6 shadow-vibrant">
                        <svg class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                    </div>
                    <h2 class="text-4xl font-black text-slate-900 tracking-tight">发布邻里互助</h2>
                    <p class="mt-4 text-slate-500 font-bold text-lg">详细描述您的需求，我们将为您匹配最合适的志愿者</p>
                </div>
                
                <form th:action="@{/demands}" method="post" enctype="multipart/form-data" class="space-y-10">
                    <div class="space-y-8">
                        <div>
                            <label for="title" class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1 mb-3">需求标题</label>
                            <input type="text" id="title" name="title" required
                                   class="block w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-bold text-slate-900"
                                   placeholder="如：家电维修、辅导作业、助老服务等">
                        </div>

                        <div>
                            <label for="summary" class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1 mb-3">简述内容</label>
                            <input type="text" id="summary" name="summary" maxlength="255" required
                                   class="block w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-bold text-slate-900"
                                   placeholder="浏览列表展示用，建议 20-60 字">
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div>
                            <label for="type" class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1 mb-3">需求技能类型</label>
                                <div class="relative">
                                    <select id="type" name="type" required
                                            class="block w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-bold text-slate-900 appearance-none">
                                        <option value="医疗急救">医疗急救</option>
                                        <option value="家电维修">家电维修</option>
                                        <option value="心理疏导">心理疏导</option>
                                        <option value="课业辅导">课业辅导</option>
                                        <option value="法律咨询">法律咨询</option>
                                        <option value="环境保护">环境保护</option>
                                    </select>
                                    <div class="absolute inset-y-0 right-0 pr-6 flex items-center pointer-events-none text-slate-400">
                                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <label for="urgency" class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1 mb-3">紧急程度</label>
                                <div class="relative">
                                    <select id="urgency" name="urgency" required
                                            class="block w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-bold text-slate-900 appearance-none">
                                        <option value="LOW">普通</option>
                                        <option value="MEDIUM">较急</option>
                                        <option value="HIGH">紧急</option>
                                    </select>
                                    <div class="absolute inset-y-0 right-0 pr-6 flex items-center pointer-events-none text-slate-400">
                                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label for="expectedTime" class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1 mb-3">期望服务时间</label>
                            <input type="datetime-local" id="expectedTime" name="expectedTime" required
                                   class="block w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-bold text-slate-900">
                            <script>
                                (function () {
                                    var el = document.getElementById('expectedTime');
                                    if (!el) return;
                                    var d = new Date();
                                    var pad = function (n) { return String(n).padStart(2, '0'); };
                                    var local = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
                                    el.max = local;
                                    if (!el.value) el.value = local;
                                })();
                            </script>
                        </div>

                        <div>
                            <label for="content" class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1 mb-3">详细描述</label>
                            <textarea id="content" name="content" rows="5" required
                                      class="block w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-bold text-slate-900 resize-none"
                                      placeholder="请详细说明您的需求，以便志愿者更好地为您提供帮助。"></textarea>
                        </div>

                        <div>
                            <label for="image" class="block text-xs font-black text-slate-400 uppercase tracking-widest ml-1 mb-3">任务图片（可选）</label>
                            <input type="file" id="image" name="image" accept="image/*"
                                   class="block w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-primary-500 transition-all outline-none font-bold text-slate-900 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-white file:font-black file:text-slate-700 hover:file:bg-slate-50">
                            <p class="mt-3 text-xs font-bold text-slate-400">支持常见图片格式，建议小于 2MB</p>
                        </div>
                    </div>

                    <div class="pt-6">
                        <button type="submit"
                                class="w-full py-5 bg-primary-600 text-white font-black rounded-2xl hover:bg-primary-700 shadow-vibrant hover:scale-[1.02] active:scale-[0.98] transition-all text-xl">
                            立即发布需求
                        </button>
                        <p class="text-center text-slate-400 font-bold text-xs uppercase tracking-widest mt-6">发布后系统将自动为您推荐匹配的志愿者</p>
                    </div>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
