<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(title=${activity.title}, content=~{::section})}">
<body>
    <section class="max-w-5xl mx-auto space-y-12 pb-20">
        <!-- Breadcrumbs -->
        <nav class="flex text-sm font-bold text-slate-400 uppercase tracking-widest" aria-label="Breadcrumb">
            <ol class="flex items-center space-x-2">
                <li><a href="/activities" class="hover:text-primary-600 transition-colors">活动列表</a></li>
                <li class="flex items-center space-x-2">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                    <span class="text-slate-900" th:text="${activity.title}">活动名称</span>
                </li>
            </ol>
        </nav>

        <div class="flex flex-col lg:flex-row gap-12">
            <!-- Left: Content -->
            <div class="flex-1 space-y-12">
                <div class="bg-white rounded-[3rem] shadow-soft border border-slate-100 overflow-hidden">
                    <div class="h-[400px] bg-slate-100 relative group overflow-hidden">
                        <img th:if="${activity.imageUrl != null}" th:src="${activity.imageUrl}" alt="活动图片" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                        <div th:if="${activity.imageUrl == null}" class="absolute inset-0 flex items-center justify-center text-slate-300">
                            <svg class="h-32 w-32 opacity-20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                        </div>
                        <div class="absolute top-8 left-8 flex flex-wrap gap-3">
                            <span th:if="${activity.requiredSkills != null and !activity.requiredSkills.isEmpty()}" th:each="skill : ${activity.requiredSkills}" th:text="${skill}"
                                  class="px-6 py-2 bg-white/95 backdrop-blur-md rounded-2xl text-xs font-black uppercase tracking-widest text-primary-700 shadow-lg">技能</span>
                        </div>
                    </div>
                    
                    <div class="p-10 md:p-16">
                        <h1 th:text="${activity.title}" class="text-4xl md:text-5xl font-black text-slate-900 tracking-tight mb-8">活动名称</h1>
                        
                        <div th:if="${param.enrolled}" class="p-6 bg-green-50 border-2 border-green-100 text-green-700 rounded-3xl mb-10 flex items-start">
                            <div class="h-10 w-10 bg-white rounded-full flex items-center justify-center mr-4 shadow-sm flex-shrink-0">
                                <svg class="h-6 w-6 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg>
                            </div>
                            <div>
                                <p class="font-black text-lg">报名申请已提交！</p>
                                <p class="text-sm font-bold opacity-80 mt-1">请等待管理员审核，审核通过后您将收到通知并可在个人中心查看。</p>
                            </div>
                        </div>

                        <div th:if="${param.error}" class="p-6 bg-red-50 border-2 border-red-100 text-red-700 rounded-3xl mb-10 flex items-start animate-shake">
                            <div class="h-10 w-10 bg-white rounded-full flex items-center justify-center mr-4 shadow-sm flex-shrink-0">
                                <svg class="h-6 w-6 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" /></svg>
                            </div>
                            <div>
                                <p class="font-black text-lg">报名失败</p>
                                <p class="text-sm font-bold opacity-80 mt-1" th:text="${param.error}">错误信息</p>
                            </div>
                        </div>

                        <div class="prose prose-slate max-w-none">
                            <h2 class="text-2xl font-black text-slate-900 mb-6 flex items-center">
                                <span class="h-8 w-1.5 bg-primary-600 rounded-full mr-4"></span>
                                活动详情描述
                            </h2>
                            <p th:text="${activity.description}" class="text-slate-600 text-lg leading-relaxed font-medium whitespace-pre-line">描述内容...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: Sidebar -->
            <div class="lg:w-96 space-y-8">
                <div class="bg-white rounded-[2.5rem] shadow-soft border border-slate-100 p-10 sticky top-28">
                    <div class="space-y-8">
                        <div>
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4">积分奖励</p>
                            <div class="flex items-center gap-3">
                                <div class="h-12 w-12 bg-primary-50 rounded-2xl flex items-center justify-center text-primary-600 shadow-sm">
                                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                </div>
                                <div>
                                    <span th:text="${activity.basePoints}" class="text-3xl font-black text-slate-900 tracking-tighter">0</span>
                                    <span class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">积分 / 小时</span>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-6">
                            <div class="flex items-start">
                                <div class="h-10 w-10 bg-slate-50 rounded-xl flex items-center justify-center text-slate-400 mr-4 shadow-sm">
                                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                                </div>
                                <div>
                                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">开始时间</p>
                                    <p class="font-bold text-slate-900" th:text="${#temporals.format(activity.startTime, 'yyyy-MM-dd HH:mm')}">时间</p>
                                </div>
                            </div>
                            <div class="flex items-start">
                                <div class="h-10 w-10 bg-slate-50 rounded-xl flex items-center justify-center text-slate-400 mr-4 shadow-sm">
                                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                </div>
                                <div>
                                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">结束时间</p>
                                    <p class="font-bold text-slate-900" th:text="${#temporals.format(activity.endTime, 'yyyy-MM-dd HH:mm')}">时间</p>
                                </div>
                            </div>
                            <div class="flex items-start">
                                <div class="h-10 w-10 bg-slate-50 rounded-xl flex items-center justify-center text-slate-400 mr-4 shadow-sm">
                                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                                </div>
                                <div>
                                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">活动地点</p>
                                    <p class="font-bold text-slate-900" th:text="${activity.location}">地点</p>
                                </div>
                            </div>
                        </div>

                        <div class="pt-8 border-t border-slate-50">
                            <div class="flex justify-between mb-4">
                                <span class="text-sm font-black text-slate-400 uppercase tracking-widest">报名进度</span>
                                <span class="text-sm font-black text-primary-600"><span th:text="${activity.enrolledNumber}">0</span> / <span th:text="${activity.recruitNumber}">0</span></span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-3 mb-8 overflow-hidden shadow-inner">
                                <div class="bg-gradient-to-r from-primary-500 to-primary-700 h-full rounded-full transition-all duration-1000 shadow-sm" th:style="|width: ${activity.progressPercentage}%|"></div>
                            </div>
                            
                            <form th:action="@{/activities/{id}/enroll(id=${activity.id})}" method="post">
                                <button type="submit"
                                        th:disabled="${activity.enrolledNumber >= activity.recruitNumber}"
                                        class="w-full py-5 bg-primary-600 text-white font-black rounded-2xl hover:bg-primary-700 shadow-vibrant hover:scale-[1.02] active:scale-[0.98] transition-all text-lg disabled:bg-slate-200 disabled:text-slate-400 disabled:shadow-none disabled:cursor-not-allowed">
                                    <span th:if="${activity.enrolledNumber < activity.recruitNumber}">立即报名参加</span>
                                    <span th:if="${activity.enrolledNumber >= activity.recruitNumber}">报名人数已满</span>
                                </button>
                            </form>
                            <p class="text-center text-[10px] font-black text-slate-400 uppercase tracking-widest mt-4">完成服务后积分将自动发放</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
