<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(title='个人中心', content=~{::section})}">
<body>
    <section class="max-w-6xl mx-auto space-y-12 pb-20">
        <!-- Profile Header Card -->
        <div class="bg-white rounded-[3rem] shadow-soft border border-slate-100 overflow-hidden relative">
            <div class="absolute top-0 right-0 h-32 w-full bg-gradient-to-r from-primary-600 to-blue-600 opacity-10"></div>
            <div class="p-10 md:p-16 relative flex flex-col md:flex-row items-center md:items-start gap-10">
                <div class="relative group">
                    <div class="h-32 w-32 rounded-[2.5rem] overflow-hidden bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center text-white text-5xl font-black shadow-xl group-hover:rotate-6 transition-transform">
                        <img th:if="${user.avatarUrl != null}" th:src="${user.avatarUrl}" alt="avatar" class="h-32 w-32 object-cover">
                        <span th:if="${user.avatarUrl == null}" th:text="${user.realName.substring(0,1).toUpperCase()}">U</span>
                    </div>
                    <form th:action="@{/profile/avatar}" method="post" enctype="multipart/form-data" class="absolute -bottom-2 -right-2">
                        <label class="h-10 w-10 bg-white rounded-2xl shadow-md flex items-center justify-center border-4 border-white cursor-pointer hover:bg-slate-50 transition">
                            <input type="file" name="avatar" accept="image/*" class="hidden" onchange="this.form.submit()">
                            <svg class="h-5 w-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7h4l2-2h6l2 2h4v12H3V7z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11a3 3 0 100 6 3 3 0 000-6z" />
                            </svg>
                        </label>
                    </form>
                </div>
                
                <div class="flex-grow text-center md:text-left">
                    <div class="flex flex-col md:flex-row md:items-center gap-4 mb-4">
                        <h1 th:text="${user.realName}" class="text-4xl font-black text-slate-900 tracking-tight">姓名</h1>
                        <div class="flex items-center gap-2">
                            <span th:text="${user.role == T(com.community.service.entity.Role).VOLUNTEER ? '志愿者' : '社区居民'}"
                                  class="px-4 py-1.5 bg-primary-50 text-primary-700 text-[10px] font-black uppercase tracking-widest rounded-xl border border-primary-100">身份</span>
                            <span th:if="${volunteerProfile != null && volunteerProfile.auditStatus == T(com.community.service.entity.VolunteerProfile.AuditStatus).PENDING}"
                                  class="px-4 py-1.5 bg-yellow-50 text-yellow-700 text-[10px] font-black uppercase tracking-widest rounded-xl border border-yellow-100 animate-pulse">待审核</span>
                        </div>
                    </div>
                    <p class="text-slate-400 font-bold flex items-center justify-center md:justify-start gap-2 mb-8">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg>
                        手机号：<span th:text="${user.username}">13800000000</span>
                    </p>
                    
                    <div class="flex flex-wrap justify-center md:justify-start gap-6">
                        <div class="bg-slate-50 p-6 rounded-[2rem] border border-slate-100 min-w-[140px] group hover:border-primary-200 transition-colors">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">当前积分</p>
                            <p class="text-3xl font-black text-primary-600 tracking-tighter" th:text="${user.points}">0</p>
                        </div>
                        <div th:if="${user.role == T(com.community.service.entity.Role).VOLUNTEER}" class="bg-slate-50 p-6 rounded-[2rem] border border-slate-100 min-w-[140px] group hover:border-primary-200 transition-colors">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">服务时长</p>
                            <p class="text-3xl font-black text-slate-900 tracking-tighter" th:text="${#numbers.formatDecimal(totalHours, 1, 1) + 'h'}">0h</p>
                        </div>
                    </div>
                </div>
                
                <div class="flex-shrink-0">
                    <a href="/points" class="inline-flex items-center px-6 py-3 bg-white border-2 border-slate-100 text-slate-600 font-black rounded-2xl hover:border-primary-600 hover:text-primary-600 transition-all text-sm group">
                        积分记录明细
                        <svg class="ml-2 h-5 w-5 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" /></svg>
                    </a>
                </div>
            </div>
        </div>

        <!-- Volunteer Specific Sections -->
        <div th:if="${user.role == T(com.community.service.entity.Role).VOLUNTEER}" class="grid grid-cols-1 lg:grid-cols-3 gap-12">
            <!-- Skills -->
            <div class="lg:col-span-1 space-y-8">
                <div class="bg-white p-10 rounded-[3rem] shadow-soft border border-slate-100">
                    <h2 class="text-2xl font-black text-slate-900 mb-8 flex items-center">
                        <span class="h-6 w-1.5 bg-primary-600 rounded-full mr-4"></span>
                        技能标签
                    </h2>
                    <div class="flex flex-wrap gap-3">
                        <span th:each="skill : ${volunteerProfile.skills}" th:text="${skill}"
                              class="px-5 py-2.5 bg-blue-50 text-blue-700 rounded-2xl border border-blue-100 font-black text-xs uppercase tracking-widest">技能</span>
                    </div>
                </div>
            </div>

            <!-- Service History -->
            <div class="lg:col-span-2 space-y-8">
                <div class="flex items-center justify-between">
                    <h2 class="text-3xl font-black text-slate-900 tracking-tight">服务记录</h2>
                    <span class="px-4 py-1 bg-slate-100 text-slate-500 text-[10px] font-black uppercase tracking-widest rounded-full" th:text="${registrations.size() + ' 个记录'}">0 个记录</span>
                </div>
                
                <div th:if="${param.check_in_success}" class="p-6 bg-green-50 border-2 border-green-100 text-green-700 rounded-3xl flex items-center animate-bounce">
                    <svg class="h-6 w-6 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg>
                    <p class="font-black">签到成功！请在服务结束后记得回来签退哦。</p>
                </div>
                <div th:if="${param.check_out_success}" class="p-6 bg-primary-50 border-2 border-primary-100 text-primary-700 rounded-3xl flex items-center animate-bounce">
                    <svg class="h-6 w-6 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    <p class="font-black">签退成功！辛苦了，您的志愿积分已实时到账。</p>
                </div>

                <div th:if="${registrations.empty}" class="bg-white p-20 rounded-[3rem] shadow-soft border border-slate-100 text-center">
                    <div class="h-20 w-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-6">
                        <span class="text-4xl">📄</span>
                    </div>
                    <h3 class="text-xl font-black text-slate-900 mb-2">还没有参加过活动</h3>
                    <p class="text-slate-500 font-bold max-w-xs mx-auto text-sm">快去浏览活动列表，开启您的第一次志愿服务吧！</p>
                </div>

                <div class="space-y-6">
                    <div th:each="reg : ${registrations}" 
                         class="group bg-white p-8 rounded-[2.5rem] shadow-soft border border-slate-100 hover:border-primary-200 transition-all duration-500">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-8">
                            <div class="flex-grow space-y-4">
                                <h3 th:text="${reg.activity.title}" class="text-2xl font-black text-slate-900 group-hover:text-primary-600 transition-colors">活动名称</h3>
                                <div class="flex flex-wrap items-center gap-6 text-sm font-bold text-slate-400">
                                    <div class="flex items-center">
                                        <svg class="h-5 w-5 mr-2 text-primary-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                                        <span th:text="${#temporals.format(reg.activity.startTime, 'yyyy-MM-dd')}">日期</span>
                                    </div>
                                    <div th:if="${reg.serviceHours != null}" class="flex items-center px-3 py-1 bg-slate-50 rounded-lg border border-slate-100">
                                        <svg class="h-4 w-4 mr-2 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                        时长：<span th:text="${#numbers.formatDecimal(reg.serviceHours, 1, 1) + 'h'}" class="text-slate-900 ml-1">时长</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="flex items-center gap-6">
                                <div class="text-right">
                                    <span th:text="${reg.status}" 
                                          th:class="${reg.status == T(com.community.service.entity.Registration.RegistrationStatus).CHECKED_OUT ? 'bg-green-50 text-green-700 border-green-100' : 
                                                     (reg.status == T(com.community.service.entity.Registration.RegistrationStatus).CHECKED_IN ? 'bg-yellow-50 text-yellow-700 border-yellow-100' : 'bg-primary-50 text-primary-700 border-primary-100')}"
                                          class="px-4 py-1.5 text-[10px] font-black uppercase tracking-widest rounded-full border">状态</span>
                                    <div th:if="${reg.earnedPoints != null}" class="mt-2 flex items-baseline justify-end gap-1">
                                        <span class="text-2xl font-black text-primary-600 tracking-tighter" th:text="${'+' + reg.earnedPoints}">+0</span>
                                        <span class="text-[10px] font-black text-primary-400 uppercase tracking-widest">Points</span>
                                    </div>
                                </div>
                                
                                <!-- Action Buttons -->
                                <div class="flex-shrink-0">
                                    <form th:if="${reg.status == T(com.community.service.entity.Registration.RegistrationStatus).APPROVED}" 
                                          th:action="@{/activities/check-in/{id}(id=${reg.id})}" method="post">
                                        <button type="submit" class="px-8 py-3 bg-primary-600 text-white font-black rounded-2xl hover:bg-primary-700 shadow-vibrant hover:scale-105 active:scale-95 transition-all text-sm">签到</button>
                                    </form>
                                    <form th:if="${reg.status == T(com.community.service.entity.Registration.RegistrationStatus).CHECKED_IN}" 
                                          th:action="@{/activities/check-out/{id}(id=${reg.id})}" method="post">
                                        <button type="submit" class="px-8 py-3 bg-red-600 text-white font-black rounded-2xl hover:bg-red-700 shadow-lg hover:scale-105 active:scale-95 transition-all text-sm">签退</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
