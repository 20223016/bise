<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="zh" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' - 社区志愿者服务系统' : '社区志愿者服务系统'}">社区志愿者服务系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        [x-cloak] { display: none !important; }
        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .nav-link-active {
            color: #0284c7;
            border-bottom: 2px solid #0284c7;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc',
                            400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1',
                            800: '#075985', 900: '#0c4a6e', 950: '#082f49',
                        }
                    },
                    borderRadius: {
                        '2xl': '1rem',
                        '3xl': '1.5rem',
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'vibrant': '0 10px 25px -3px rgba(2, 132, 199, 0.15)',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col selection:bg-primary-100 selection:text-primary-700">
    <!-- Navigation -->
    <nav class="glass-nav border-b border-slate-200/60 sticky top-0 z-50 transition-all duration-300" x-data="{ mobileMenuOpen: false, scrolled: false }" @scroll.window="scrolled = window.pageYOffset > 20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20">
                <div class="flex items-center">
                    <div class="flex-shrink-0 flex items-center group">
                        <div class="h-10 w-10 bg-primary-600 rounded-xl flex items-center justify-center mr-3 shadow-vibrant group-hover:rotate-12 transition-transform">
                            <svg class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                            </svg>
                        </div>
                        <a href="/" class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-primary-600 to-primary-800 bg-clip-text text-transparent">
                            社区志愿者
                        </a>
                    </div>
                    <div class="hidden md:ml-12 md:flex md:space-x-10">
                        <a href="/activities" class="inline-flex items-center px-1 pt-1 text-sm font-semibold text-slate-600 hover:text-primary-600 transition-colors border-b-2 border-transparent hover:border-primary-200">
                            浏览活动
                        </a>
                        <a href="/demands" class="inline-flex items-center px-1 pt-1 text-sm font-semibold text-slate-600 hover:text-primary-600 transition-colors border-b-2 border-transparent hover:border-primary-200">
                            互助需求
                        </a>
                        <a sec:authorize="hasRole('VOLUNTEER')" href="/volunteer/tasks" class="inline-flex items-center px-1 pt-1 text-sm font-semibold text-slate-600 hover:text-primary-600 transition-colors border-b-2 border-transparent hover:border-primary-200">
                            任务合集
                        </a>

                        <a sec:authorize="hasRole('RESIDENT')" href="/demands/my" class="inline-flex items-center px-1 pt-1 text-sm font-semibold text-slate-600 hover:text-primary-600 transition-colors border-b-2 border-transparent hover:border-primary-200">
                            我的需求
                        </a>
                        <a sec:authorize="hasRole('VOLUNTEER') or hasRole('ADMIN')" href="/redemption" class="inline-flex items-center px-1 pt-1 text-sm font-semibold text-slate-600 hover:text-primary-600 transition-colors border-b-2 border-transparent hover:border-primary-200">
                            积分兑换
                        </a>
                    </div>
                </div>
                <div class="hidden md:flex md:items-center space-x-6">
                    <div sec:authorize="isAnonymous()" class="flex items-center space-x-4">
                        <a href="/login" class="text-sm font-bold text-slate-600 hover:text-primary-600 px-4 py-2 rounded-lg hover:bg-slate-100 transition">登录</a>
                        <a href="/register" class="bg-primary-600 text-white text-sm font-bold px-6 py-2.5 rounded-xl hover:bg-primary-700 shadow-vibrant hover:scale-105 active:scale-95 transition-all">加入我们</a>
                    </div>
                    <div sec:authorize="isAuthenticated()" class="relative" x-data="{ profileOpen: false }">
                        <button @click="profileOpen = !profileOpen" type="button" class="flex items-center group p-1 pr-3 rounded-full hover:bg-slate-100 transition-all focus:outline-none">
                            <div class="h-10 w-10 rounded-full overflow-hidden bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center text-white font-black shadow-soft">
                                <img th:if="${#authentication.principal.avatarUrl != null}" th:src="${#authentication.principal.avatarUrl}" alt="avatar" class="h-10 w-10 object-cover">
                                <span th:if="${#authentication.principal.avatarUrl == null}" th:text="${#authentication.name.substring(0,1).toUpperCase()}">U</span>
                            </div>
                            <div class="ml-3 text-left">
                                <div class="text-sm font-bold text-slate-900 leading-tight" th:text="${#authentication.name}">Username</div>
                                <div class="text-[10px] font-bold text-primary-600 uppercase tracking-wider">在线</div>
                            </div>
                            <svg class="ml-2 h-4 w-4 text-slate-400 group-hover:text-primary-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                        <div x-show="profileOpen" @click.away="profileOpen = false" x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition ease-in duration-75" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95" x-cloak
                             class="origin-top-right absolute right-0 mt-3 w-56 rounded-2xl shadow-xl py-2 bg-white ring-1 ring-black ring-opacity-5 divide-y divide-slate-100 focus:outline-none overflow-hidden">
                            <div class="px-4 py-3">
                                <p class="text-xs text-slate-500 font-medium">当前身份</p>
                                <p class="text-sm font-bold text-primary-700 mt-0.5" sec:authentication="principal.role">Role</p>
                            </div>
                            <div class="py-1">
                                <a th:href="@{/profile}" class="flex items-center px-4 py-2.5 text-sm text-slate-700 hover:bg-primary-50 hover:text-primary-700 transition-colors">
                                    <svg class="h-4 w-4 mr-3 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                                    个人中心
                                </a>
                                <a th:href="@{/assistant}" class="flex items-center px-4 py-2.5 text-sm text-slate-700 hover:bg-primary-50 hover:text-primary-700 transition-colors">
                                    <svg class="h-4 w-4 mr-3 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z" /></svg>
                                    AI 小助手
                                </a>
                                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="flex items-center px-4 py-2.5 text-sm text-slate-700 hover:bg-primary-50 hover:text-primary-700 transition-colors">
                                    <svg class="h-4 w-4 mr-3 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                                    后台管理
                                </a>
                            </div>
                            <div class="py-1">
                                <form th:action="@{/logout}" method="post">
                                    <button type="submit" class="w-full flex items-center px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors">
                                        <svg class="h-4 w-4 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                                        退出登录
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Mobile menu button -->
                <div class="flex items-center md:hidden">
                    <button @click="mobileMenuOpen = !mobileMenuOpen" type="button" class="inline-flex items-center justify-center p-2 rounded-xl text-slate-500 hover:bg-slate-100 transition-colors focus:outline-none ring-2 ring-transparent active:ring-primary-500">
                        <span class="sr-only">Open main menu</span>
                        <svg class="h-6 w-6" x-show="!mobileMenuOpen" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
                        <svg class="h-6 w-6" x-show="mobileMenuOpen" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile menu -->
        <div class="md:hidden border-t border-slate-100 bg-white" x-show="mobileMenuOpen" x-cloak x-transition>
            <div class="pt-2 pb-3 space-y-1">
                <a href="/activities" class="block pl-4 pr-4 py-3 text-base font-bold text-slate-600 hover:bg-primary-50 hover:text-primary-700 transition-all border-l-4 border-transparent hover:border-primary-600">浏览活动</a>
                <a href="/demands" class="block pl-4 pr-4 py-3 text-base font-bold text-slate-600 hover:bg-primary-50 hover:text-primary-700 transition-all border-l-4 border-transparent hover:border-primary-600">互助需求</a>
                <a sec:authorize="hasRole('VOLUNTEER')" href="/volunteer/tasks" class="block pl-4 pr-4 py-3 text-base font-bold text-slate-600 hover:bg-primary-50 hover:text-primary-700 transition-all border-l-4 border-transparent hover:border-primary-600">任务合集</a>
                <a sec:authorize="hasRole('VOLUNTEER') or hasRole('ADMIN')" href="/redemption" class="block pl-4 pr-4 py-3 text-base font-bold text-slate-600 hover:bg-primary-50 hover:text-primary-700 transition-all border-l-4 border-transparent hover:border-primary-600">积分兑换</a>
            </div>
            <div sec:authorize="isAnonymous()" class="pt-4 pb-6 px-4 border-t border-slate-100">
                <div class="grid grid-cols-2 gap-4">
                    <a href="/login" class="flex items-center justify-center px-4 py-3 text-base font-bold text-slate-600 bg-slate-50 rounded-xl hover:bg-slate-100 transition">登录</a>
                    <a href="/register" class="flex items-center justify-center px-4 py-3 text-base font-bold text-white bg-primary-600 rounded-xl shadow-vibrant hover:bg-primary-700 transition">注册</a>
                </div>
            </div>
            <div sec:authorize="isAuthenticated()" class="pt-4 pb-6 border-t border-slate-100">
                <div class="flex items-center px-4 mb-4">
                    <div class="h-12 w-12 rounded-2xl overflow-hidden bg-primary-600 flex items-center justify-center text-white font-black shadow-vibrant">
                        <img th:if="${#authentication.principal.avatarUrl != null}" th:src="${#authentication.principal.avatarUrl}" alt="avatar" class="h-12 w-12 object-cover">
                        <span th:if="${#authentication.principal.avatarUrl == null}" th:text="${#authentication.name.substring(0,1).toUpperCase()}">U</span>
                    </div>
                    <div class="ml-4">
                        <div class="text-base font-black text-slate-900" th:text="${#authentication.name}">Username</div>
                        <div class="text-xs font-bold text-primary-600 uppercase tracking-widest" sec:authentication="principal.role">Role</div>
                    </div>
                </div>
                <div class="space-y-1">
                    <a th:href="@{/profile}" class="block px-4 py-3 text-base font-bold text-slate-600 hover:bg-primary-50 hover:text-primary-700 transition-all">个人中心</a>
                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="block px-4 py-3 text-base font-bold text-slate-600 hover:bg-primary-50 hover:text-primary-700 transition-all">后台管理</a>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="w-full text-left px-4 py-3 text-base font-bold text-red-600 hover:bg-red-50 transition-all">退出登录</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow">
        <div th:replace="${content}"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-16 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-12 mb-12">
                <div class="col-span-1 md:col-span-2">
                    <div class="flex items-center group mb-6">
                        <div class="h-8 w-8 bg-primary-600 rounded-lg flex items-center justify-center mr-2 shadow-vibrant">
                            <svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                            </svg>
                        </div>
                        <span class="text-xl font-black tracking-tight text-slate-900">社区志愿者服务系统</span>
                    </div>
                    <p class="text-slate-500 max-w-xs leading-relaxed font-medium">
                        用爱心温暖社区，用技能服务邻里。加入我们，让社区生活更美好。
                    </p>
                </div>
                <div>
                    <h4 class="text-sm font-black text-slate-900 uppercase tracking-widest mb-6">快速链接</h4>
                    <ul class="space-y-4">
                        <li><a href="/activities" class="text-slate-500 hover:text-primary-600 font-bold transition-colors">浏览活动</a></li>
                        <li><a href="/demands" class="text-slate-500 hover:text-primary-600 font-bold transition-colors">互助需求</a></li>
                        <li><a href="/redemption" class="text-slate-500 hover:text-primary-600 font-bold transition-colors">积分兑换</a></li>
                    </ul>
                </div>
                <div>
                    <h4 class="text-sm font-black text-slate-900 uppercase tracking-widest mb-6">关于我们</h4>
                    <ul class="space-y-4">
                        <li><a href="#" class="text-slate-500 hover:text-primary-600 font-bold transition-colors">联系我们</a></li>
                        <li><a href="#" class="text-slate-500 hover:text-primary-600 font-bold transition-colors">使用条款</a></li>
                        <li><a href="#" class="text-slate-500 hover:text-primary-600 font-bold transition-colors">隐私政策</a></li>
                    </ul>
                </div>
            </div>
            <div class="pt-12 border-t border-slate-100 text-center">
                <p class="text-slate-400 text-sm font-bold">
                    &copy; 2026 社区志愿者服务系统. 保留所有权利.
                </p>
            </div>
        </div>
    </footer>
</body>
</html>
